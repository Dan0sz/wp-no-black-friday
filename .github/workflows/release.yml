name: Create WordPress plugin Zip file

on:
  release:
    types: [ released, prereleased ]

jobs:
  build:
    name: Build Plugin Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate plugin artifact
        run: |
          mkdir -p release/wp-no-black-friday
          rsync -rc --exclude-from="$GITHUB_WORKSPACE/.distignore" "$GITHUB_WORKSPACE/" release/wp-no-black-friday/ --delete --delete-excluded
          cd "${GITHUB_WORKSPACE}/release" || exit
          zip -r "${GITHUB_WORKSPACE}/wp-no-black-friday.zip" .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${GITHUB_WORKSPACE}/wp-no-black-friday.zip" --repo "$GITHUB_REPOSITORY" --clobber
